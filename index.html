<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <title>Antirecetario | Construcción Modular de Platos</title>

  <!-- PWA Manifest & Mobile Metadata -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#493b31">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Antirecetario">
  
  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="./img/icons/icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/main.css?v=85">
  <link rel="stylesheet" href="css/components.css?v=88">
  <link rel="stylesheet" href="css/glassmorphism.css?v=84">
</head>
<body>

  <div class="app-shell">

    <!-- Application Header -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 140 140" fill="none">
            <circle cx="70" cy="70" r="64" fill="#ffffff" stroke="var(--text-primary, #1c1917)" stroke-width="6"/>
            <path d="M 64 20 A 46 46 0 0 0 24 60 L 64 60 Z" fill="var(--text-primary, #1c1917)"/>
            <path d="M 76 60 L 116 60 A 46 46 0 0 0 76 20 Z" fill="var(--text-primary, #1c1917)"/>
            <path d="M 24 76 A 46 46 0 0 0 64 116 L 64 76 Z" fill="var(--text-primary, #1c1917)"/>
            <path d="M 76 76 L 76 116 A 46 46 0 0 0 116 76 Z" fill="var(--text-primary, #1c1917)"/>
          </svg>
        </span>
        <div>
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <h1>Antirecetario</h1>
            <span class="tag">PWA v2.0</span>
          </div>
          <div style="font-size: 0.78rem; color: var(--text-secondary);">Platos simples con lo que hay en casa</div>
        </div>
      </div>

      <!-- Right Header Actions (Install + Navigation) -->
      <div class="header-actions">
        <div id="pwa-install-container"></div>

        <!-- SPA Navigation Tabs -->
        <nav class="app-nav">
          <button class="nav-tab active" data-tab="assembler" title="Constructor de Platos">
            <span class="nav-tab-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9.5"/>
                <line x1="12" y1="2.5" x2="12" y2="21.5"/>
                <line x1="2.5" y1="12" x2="21.5" y2="12"/>
              </svg>
            </span>
            <span class="nav-tab-label">Constructor</span>
          </button>
          <button class="nav-tab" data-tab="library" title="Biblioteca">
            <span class="nav-tab-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
                <path d="M6 6h10"/>
                <path d="M6 10h7"/>
              </svg>
            </span>
            <span class="nav-tab-label">Biblioteca</span>
          </button>
        </nav>
      </div>
    </header>

    <!-- Application Main Content Area -->
    <main class="app-main">

      <!-- TAB 1: Ensamblador de Platos (4 Columnas) -->
      <section id="assembler" class="tab-pane active">
        <!-- Inyectado dinámicamente por AssemblerComponent -->
      </section>

      <!-- TAB 2: Planificador Semanal -->
      <section id="planner" class="tab-pane">
        <!-- Inyectado dinámicamente por PlannerComponent -->
      </section>

      <!-- TAB 3: Biblioteca de Componentes -->
      <section id="library" class="tab-pane">
        <!-- Inyectado dinámicamente por LibraryComponent -->
      </section>

      <!-- TAB 4: Ajustes y Configuración -->
      <section id="settings" class="tab-pane">
        <!-- Inyectado dinámicamente por SettingsComponent -->
      </section>

    </main>

    <!-- Application Footer -->
    <footer class="app-footer">
      <div>
        Antirecetario © 2026 — Ideas simples para cocinar con lo que hay.
      </div>
      <div style="display: flex; gap: 0.75rem;">
        <button id="btnExportJSON" class="btn btn-secondary btn-sm" title="Exportar datos para migración futura">
          📦 Exportar Datos (JSON)
        </button>
        <button id="btnResetSeed" class="btn btn-secondary btn-sm" title="Restablecer datos iniciales de fábrica">
          🔄 Reiniciar Datos Seed
        </button>
      </div>
    </footer>

  </div>

  <!-- Main JavaScript Module Entrypoint -->
  <script type="module" src="js/app.js?v=90"></script>

</body>
</html>
