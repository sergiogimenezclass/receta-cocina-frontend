<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fondo blanco neutro -->
  <rect width="512" height="512" fill="#ffffff" rx="112" />

  <!-- Grupo del Plato Centrado -->
  <g transform="translate(256, 256)">
    <!-- Aro exterior del plato cerámico -->
    <circle r="215" fill="#ffffff" stroke="#171513" stroke-width="16" />
    
    <!-- Reborde interior tenue -->
    <circle r="195" fill="none" stroke="#171513" stroke-width="3" opacity="0.2" />

    <!-- Los 4 Cuadrantes en Negro Puro (C.3 Alto Contraste) -->
    <!-- 1. Superior Izquierdo: Proteína (180° a 270°) -->
    <path d="M -16, -16 L -16, -165 A 155 155 0 0 0 -165, -16 Z" fill="#171513" />

    <!-- 2. Superior Derecho: Vegetal (270° a 360°) -->
    <path d="M 16, -16 L 16, -165 A 155 155 0 0 1 165, -16 Z" fill="#171513" />

    <!-- 3. Inferior Izquierdo: Carbohidrato (90° a 180°) -->
    <path d="M -16, 16 L -165, 16 A 155 155 0 0 0 -16, 165 Z" fill="#171513" />

    <!-- 4. Inferior Derecho: Grasas Saludables (0° a 90°) -->
    <path d="M 16, 16 L 165, 16 A 155 155 0 0 1 16, 165 Z" fill="#171513" />
  </g>
</svg>
