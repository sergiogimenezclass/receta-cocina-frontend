<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="maskPlateShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#2a2018" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#2a2018" flood-opacity="0.08" />
    </filter>

    <linearGradient id="mGradProt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <linearGradient id="mGradVeg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <linearGradient id="mGradCarb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="mGradFat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
  </defs>

  <!-- Fondo completo cuadrado para el área de enmascaramiento de Android -->
  <rect width="512" height="512" fill="#f7f6f4" />

  <!-- Plato escalado a 80% para quedar 100% dentro del Safe Zone (círculo central de 410px) -->
  <g transform="translate(256, 256) scale(0.82)">
    <circle r="195" fill="#ffffff" stroke="#e6e1dc" stroke-width="3" filter="url(#maskPlateShadow)" />
    <circle r="182" fill="#faf9f7" stroke="#eae5e0" stroke-width="2" />
    <circle r="162" fill="#f4f1ee" stroke="#ded8d2" stroke-width="1.5" />

    <!-- 4 Cuadrantes -->
    <path d="M -14, -14 L -14, -150 A 140 140 0 0 0 -150, -14 Z" fill="url(#mGradProt)" />
    <path d="M 14, -14 L 14, -150 A 140 140 0 0 1 150, -14 Z" fill="url(#mGradVeg)" />
    <path d="M -14, 14 L -150, 14 A 140 140 0 0 0 -14, 150 Z" fill="url(#mGradCarb)" />
    <path d="M 14, 14 L 150, 14 A 140 140 0 0 1 14, 150 Z" fill="url(#mGradFat)" />

    <!-- Centro focal -->
    <circle r="22" fill="#ffffff" stroke="#e1ddda" stroke-width="2.5" />
    <circle r="9" fill="#493b31" />

    <path d="M -120, -120 A 170 170 0 0 1 0, -170" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
