<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Sombra suave de loza -->
    <filter id="plateShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#2a2018" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2a2018" flood-opacity="0.08" />
    </filter>

    <!-- Gradientes de los 4 cuadrantes -->
    <!-- 1. Proteína: Carmín cálido -->
    <linearGradient id="gradProt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- 2. Vegetal: Verde fresco de huerta -->
    <linearGradient id="gradVeg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- 3. Carbohidrato: Ocre / Dorado grano -->
    <linearGradient id="gradCarb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- 4. Grasa: Naranja tostado / Oliva dorada -->
    <linearGradient id="gradFat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>

    <!-- Brillo cerámico sutil -->
    <linearGradient id="ceramicSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f0ece9" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Fondo base cálido -->
  <rect width="512" height="512" fill="#f7f6f4" rx="112" />

  <!-- Grupo del Plato Centrado -->
  <g transform="translate(256, 256)">
    <!-- Plato de Loza Cerámica Exterior -->
    <circle r="195" fill="#ffffff" stroke="#e6e1dc" stroke-width="3" filter="url(#plateShadow)" />
    
    <!-- Reborde Interior de Loza -->
    <circle r="182" fill="#faf9f7" stroke="#eae5e0" stroke-width="2" />
    
    <!-- Ala interior biselada -->
    <circle r="162" fill="#f4f1ee" stroke="#ded8d2" stroke-width="1.5" />

    <!-- Los 4 Cuadrantes Culinarios -->
    <!-- Superior Izquierdo: Proteína (180° a 270°) -->
    <path d="M -14, -14 L -14, -150 A 140 140 0 0 0 -150, -14 Z" 
          fill="url(#gradProt)" />

    <!-- Superior Derecho: Vegetal (270° a 360°) -->
    <path d="M 14, -14 L 14, -150 A 140 140 0 0 1 150, -14 Z" 
          fill="url(#gradVeg)" />

    <!-- Inferior Izquierdo: Carbohidrato (90° a 180°) -->
    <path d="M -14, 14 L -150, 14 A 140 140 0 0 0 -14, 150 Z" 
          fill="url(#gradCarb)" />

    <!-- Inferior Derecho: Grasa Saludable (0° a 90°) -->
    <path d="M 14, 14 L 150, 14 A 140 140 0 0 1 14, 150 Z" 
          fill="url(#gradFat)" />

    <!-- Centro focal del plato: Botón cerámico blanco con relieve -->
    <circle r="22" fill="#ffffff" stroke="#e1ddda" stroke-width="2.5" />
    <circle r="9" fill="#493b31" />

    <!-- Toques minimalistas de brillo -->
    <path d="M -120, -120 A 170 170 0 0 1 0, -170" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
